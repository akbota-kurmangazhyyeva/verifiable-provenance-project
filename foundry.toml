[profile.default]
src = "src/contracts"
test = "test/contracts"
script = "script"
out = "out"
libs = ["lib"]

# Pinned so that bytecode and gas numbers are reproducible.
solc_version = "0.8.37"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

fs_permissions = [{ access = "read", path = "./data" }]
